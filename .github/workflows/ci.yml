name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
        dependencies: [latest]
        include:
          - python-version: "3.10"
            dependencies: floors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install latest compatible dependencies
        if: matrix.dependencies == 'latest'
        run: python -m pip install --upgrade -e '.[dev]'
      - name: Install dependency floors
        if: matrix.dependencies == 'floors'
        run: python -m pip install -e '.[dev]' 'matplotlib==3.10.0' 'numpy==1.23.0'
      # Includes the renderer regression fixtures and fake-renderer sensitivity check.
      - run: python -m pytest -q

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
      - name: Build and install wheel into a clean environment
        run: |
          uv build
          uv venv --python "$(command -v python)" .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
      - name: Verify wheel excludes development fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheel, = Path("dist").glob("*.whl")
          with ZipFile(wheel) as archive:
              names = archive.namelist()
          assert not any(Path(name).name == "gallery.py" or name.endswith(".csv") or
                         name.startswith(("examples/", "tests/")) for name in names), names
          PY
      - name: Exercise installed package outside the checkout
        run: |
          python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          cd "$(mktemp -d)"
          "$python" - <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          import trendsetter_axi
          from matplotlib.figure import Figure

          assert Path(trendsetter_axi.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert importlib.util.find_spec("pandas") is None
          assert importlib.util.find_spec("trendsetter_axi.gallery") is None
          fig = Figure()
          ax = fig.subplots()
          ax.plot([0, 1, 2], [0, 2, 1])
          assert trendsetter_axi.render_figure(fig, cols=60).strip()
          svg = '<svg xmlns="http://www.w3.org/2000/svg" width="120" height="80"><path d="M10 60 L60 10 L110 40" fill="none" stroke="black"/></svg>'
          assert trendsetter_axi.render_svg(svg, cols=60).strip()
          PY
          "$python" "$GITHUB_WORKSPACE/benchmarks/core_smoke.py"
      - name: Run renderer regression fixtures against the installed wheel
        run: |
          python="$GITHUB_WORKSPACE/.wheel-venv/bin/python"
          uv pip install --python "$python" pytest pandas
          fixtures="$(mktemp -d)"
          cp tests/test_selfchecks.py "$fixtures/"
          cd "$fixtures"
          "$python" -m pytest -q test_selfchecks.py
