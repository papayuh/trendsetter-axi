[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trendsetter-axi"
version = "0.1.0"
description = "Terminal charts: render matplotlib figures and SVG as unicode text"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "papayuh" }]
keywords = ["terminal", "charts", "matplotlib", "svg", "braille", "unicode", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy", "matplotlib", "wcwidth>=0.2.13"]

[project.urls]
Homepage = "https://github.com/papayuh/trendsetter-axi"
Source = "https://github.com/papayuh/trendsetter-axi"
Issues = "https://github.com/papayuh/trendsetter-axi/issues"
Changelog = "https://github.com/papayuh/trendsetter-axi/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gallery = ["pandas", "seaborn", "plotly", "altair", "plotnine"]
dev = ["pytest", "pandas"]

[tool.hatch.build.targets.wheel]
packages = ["src/trendsetter_axi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
